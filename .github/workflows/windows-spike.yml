name: Windows spike
on:
  push:
    branches: [windows-spike]
permissions:
  contents: read
jobs:
  spike:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Inventory
        shell: bash
        run: |
          for t in gfortran gcc nm ninja cmake cl link; do echo "== $t"; which -a $t || true; done
          gfortran --version || true
          ls /c/mingw64/bin 2>/dev/null | head -30 || true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build wheel (MSVC C++ + MinGW gfortran, Ninja)
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          FC: gfortran
        run: |
          gfortran --version
          uv build --wheel --python 3.12 --out-dir dist -v 2>&1 | tail -80
      - name: Inspect the object files
        shell: bash
        run: |
          find . -name '*.obj' -o -name '*.o' | grep -i -E 'l1_|fortran' | head
          for f in $(find . -path ./.venv -prune -o -name '*.f90.obj' -print -o -name '*.f90.o' -print); do echo "== $f"; nm "$f" | head -60; echo "-- undefined:"; nm -u "$f"; done
      - name: Install and check the wheel
        shell: bash
        run: |
          uv venv --python 3.12 .test-venv
          uv pip install --python .test-venv/Scripts/python.exe dist/*.whl numpy
          .test-venv/Scripts/python.exe scripts/check_installed_wheel.py
      - name: Imports of the module
        shell: bash
        run: |
          .test-venv/Scripts/python.exe -c "import sys; sys.path.insert(0,'scripts'); import check_installed_wheel as c, l1fit._core as m; print(c.pe_imported_dlls(__import__('pathlib').Path(m.__file__)))"
          dumpbin //dependents .test-venv/Lib/site-packages/l1fit/_core.pyd
