name: Wheels

# Builds the source distribution and one stable-ABI (abi3) wheel per platform, then tests every wheel
# on every supported Python version. Windows (x86_64 only) uses MSVC for the C++ and MinGW-w64 gfortran for the
# Fortran; that is possible because the Fortran code needs no runtime library (see CMakeLists.txt).
# A tag "vX.Y.Z" that matches the version in pyproject.toml publishes the sdist and the wheels to PyPI (last job).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}  # never cancel a release half-way

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build the sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: sdist
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Linux x86_64", runner: ubuntu-24.04, artifact: wheel-linux-x86_64}
          - {name: "Linux aarch64", runner: ubuntu-24.04-arm, artifact: wheel-linux-aarch64}
          - {name: "macOS arm64", runner: macos-15, artifact: wheel-macos-arm64}
          - {name: "macOS x86_64", runner: macos-15-intel, artifact: wheel-macos-x86_64}
          - {name: "Windows x86_64", runner: windows-2025, artifact: wheel-windows-x86_64}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist

      - uses: astral-sh/setup-uv@v10.2.0

      # The Linux wheels are built in a manylinux container
      # (manylinux_2_28 ships gfortran 14, nothing to install).
      # The macOS runner images have no unversioned gfortran on the PATH: use the versioned one that Homebrew's
      # gcc provides, or install gcc. FC tells CMake which compiler to use.
      - name: Select gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          fc="$(find /opt/homebrew/bin /usr/local/bin -name "gfortran*" 2>/dev/null | sort | head -n 1)"
          if [ -z "$fc" ]; then
            brew install gcc
            fc="$(find /opt/homebrew/bin /usr/local/bin -name "gfortran*" | sort | head -n 1)"
          fi
          echo "FC=$fc" >> "$GITHUB_ENV"
          "$fc" --version

      # Windows: the MSVC environment for the C++ (Ninja needs it on the PATH). gfortran is the MinGW-w64 one that
      # the runner image provides; pyproject.toml ([tool.cibuildwheel.windows]) selects Ninja and gfortran.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      # package-dir does not expand globs, so resolve the sdist file name first.
      - name: Locate the sdist
        id: sdist
        shell: bash
        run: echo "path=$(ls sdist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build the wheel from the sdist
        uses: pypa/cibuildwheel@v4.3.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    name: Test (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      # The reference implementations of the test-suite are compiled with gfortran when the tests start.
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Select gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          fc="$(find /opt/homebrew/bin /usr/local/bin -name "gfortran*" 2>/dev/null | sort | head -n 1)"
          if [ -z "$fc" ]; then
            brew install gcc
            fc="$(find /opt/homebrew/bin /usr/local/bin -name "gfortran*" | sort | head -n 1)"
          fi
          mkdir -p "$RUNNER_TEMP/fortran-bin"
          ln -s "$fc" "$RUNNER_TEMP/fortran-bin/gfortran"
          echo "$RUNNER_TEMP/fortran-bin" >> "$GITHUB_PATH"

      - name: Check gfortran
        run: gfortran --version

      - name: Select the wheel of this platform
        id: platform
        shell: bash
        run: |
          case "${{ matrix.runner }}" in
            ubuntu-24.04) echo "artifact=wheel-linux-x86_64" >> "$GITHUB_OUTPUT" ;;
            ubuntu-24.04-arm) echo "artifact=wheel-linux-aarch64" >> "$GITHUB_OUTPUT" ;;
            macos-15) echo "artifact=wheel-macos-arm64" >> "$GITHUB_OUTPUT" ;;
            macos-15-intel) echo "artifact=wheel-macos-x86_64" >> "$GITHUB_OUTPUT" ;;
            windows-2025) echo "artifact=wheel-windows-x86_64" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.platform.outputs.artifact }}
          path: wheelhouse

      # An environment that contains the installed wheel, not the source tree (python/ is not on the path).
      - name: Install the wheel and the test dependencies
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .test-venv
          if [ "$RUNNER_OS" = Windows ]; then py=.test-venv/Scripts/python.exe; else py=.test-venv/bin/python; fi
          echo "TEST_PYTHON=$py" >> "$GITHUB_ENV"
          uv pip install --python "$py" wheelhouse/*.whl numpy scipy pytest
          "$py" -c "import l1fit; print(l1fit.__file__)"

      - name: Check the installed wheel
        shell: bash
        run: '"$TEST_PYTHON" scripts/check_installed_wheel.py'

      - name: Run the test-suite against the installed wheel
        shell: bash
        run: '"$TEST_PYTHON" -m pytest tests -q -p no:cacheprovider'

  # Trusted publishing (OpenID Connect): no API token is stored anywhere. One-time set-up on pypi.org, under
  # "Publishing" of the project (or as a pending publisher before the first release): owner jhelgert,
  # repository l1fit, workflow wheels.yml, environment pypi. Create the environment "pypi" in the repository
  # settings; adding required reviewers there turns every release into a manual approval.
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/l1fit/
    permissions:
      contents: read  # checkout (a job-level permissions block replaces the defaults)
      id-token: write  # the only job that may request the OIDC token
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "{sdist,wheel-*}"
          merge-multiple: true
          path: dist

      - name: Check the tag and the files
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $version in pyproject.toml"
            exit 1
          fi
          ls -l dist
          expected=6   # one sdist and the wheels of Linux x86_64/aarch64, macOS arm64/x86_64 and Windows x86_64
          actual="$(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)"
          if [ "$actual" -ne "$expected" ] || [ "$(find dist -type f | wc -l)" -ne "$expected" ]; then
            echo "::error::expected $expected files in dist/, found $actual distributions"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
